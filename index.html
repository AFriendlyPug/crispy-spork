<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tamacat.dev</title>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-wrap">
    <div class="card">

        <!-- HEADER: avatar + name -->
        <div class="card-header">
            <div>
                <div class="avatar-wrap">
                    <img src="images/azalea/avatar.png" alt="avatar">
                </div>
                <p class="avatar-credit">
                    Design by <a href="https://www.deviantart.com/sirinart95" target="_blank">Sirinart95</a>
                </p>
            </div>
            <div class="card-titles">
                <h1>Tama</h1>
                <h4 id="meta-line"></h4>
            </div>
        </div>

        <hr class="card-divider">

        <!-- CHARACTERS SECTION -->
        <p class="characters-desc">
            Hi, Suprised you found this, if you don't know me I'm Tama or Pug. <br>
            I enjoy art and like to commission and collect from various places.<br>
            Here are some of my characters below.
        </p>
        <p class="characters-title">Characters</p>
        <div class="characters-buttons">
            <a href="https://toyhou.se/24493539.azalea" class="btn-characters">Azalea</a>
        </div>

        <hr class="card-divider">

        <!-- SOCIAL ICONS -->
        <div class="card-socials">

            <a href="https://www.twitch.tv/afriendlypug" target="_blank" title="Twitch">
                <i class="fab fa-x-twitter fa-fw fa-2x">Twitch</i>
            </a>

            <a href="https://toyhou.se/TamaCat" target="_blank" title="Toyhou.se">
                <i class="fab fa-deviantart fa-fw fa-2x">Toyhou.se</i>
            </a>

        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
