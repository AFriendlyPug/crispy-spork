<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 560px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.125rem;
      color: #888;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: #f0f0f0;
      margin: 0 auto 2rem;
      border-radius: 2px;
    }

    a {
      color: #f0f0f0;
      text-decoration: none;
      border-bottom: 1px solid #555;
      padding-bottom: 1px;
      transition: border-color 0.2s;
    }

    a:hover {
      border-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coming Soon</h1>
  </div>
</body>
</html>
