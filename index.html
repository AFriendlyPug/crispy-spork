<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tamacat.dev</title>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.2/css/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary:   #4e3668; /* base purple                  */
            --color-secondary: #7a5c9a; /* mid purple — borders, accents */
            --color-light:     #b89fcc; /* light purple — muted text     */
            --color-dark:      #2e1f45; /* deep purple — hover states    */
            --color-link:      #6b5585; /* body-copy purple — desc text  */
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a0f2e;
            font-family: 'Lato', sans-serif;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        @keyframes mesh-drift {
            0%   { transform: translate(0%,    0%)   scale(1);    }
            25%  { transform: translate(18%,  -20%)  scale(1.1);  }
            50%  { transform: translate(-20%,  18%)  scale(1.15); }
            75%  { transform: translate(15%,   22%)  scale(1.08); }
            100% { transform: translate(0%,    0%)   scale(1);    }
        }

        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background-image:
                radial-gradient(at 20% 15%, rgba(235, 218, 228, 0.85) 0px, transparent 40%),
                radial-gradient(at 80% 10%, rgba(165, 110, 181, 0.85) 0px, transparent 38%),
                radial-gradient(at 55% 55%, rgba(78, 54, 104, 0.9)   0px, transparent 44%),
                radial-gradient(at 10% 80%, rgba(158, 137, 154, 0.8) 0px, transparent 36%),
                radial-gradient(at 85% 75%, rgba(46, 31, 69, 0.9)    0px, transparent 38%),
                radial-gradient(at 40% 90%, rgba(165, 110, 181, 0.7) 0px, transparent 32%);
            filter: blur(80px);
            animation: mesh-drift 18s ease-in-out infinite;
            z-index: 0;
        }

        .card-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 1.5rem 0;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #343a40;
            font-size: 10.5pt;
            letter-spacing: .25px;
            border-radius: 1em;
            padding: 2.5rem;
            text-align: center;
        }

        /* ── avatar ── */
        .avatar-wrap {
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.35);
        }

        .avatar-wrap img {
            max-height: 150px;
            max-width: 150px;
            border-radius: 5px;
            display: block;
        }

        /* ── header: avatar + name ── */
        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
        }

        .card-titles h1 {
            color: var(--color-primary);
            font-size: 2em;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: .5rem;
        }

        .card-titles h4 {
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── divider ── */
        .card-divider {
            width: 50%;
            border: none;
            border-top: 1px solid var(--color-secondary);
            margin: 1.5rem auto;
        }

        /* ── tags ── */
        .card-tags {
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            min-height: 1.2em;
        }

        /* ── characters section ── */
        .characters-title {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--color-primary);
            margin-bottom: .6rem;
        }

        .characters-desc {
            font-size: .85rem;
            color: var(--color-link);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .characters-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .5rem;
        }

        /* ── characters button ── */
        .btn-characters {
            display: inline-block;
            padding: .5rem 2rem;
            border: 1px solid var(--color-secondary);
            border-radius: 5px;
            color: var(--color-primary);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: .85rem;
            transition: background-color .2s, color .2s;
        }

        .btn-characters:hover {
            background-color: var(--color-primary);
            color: #fff;
        }

        /* ── social icons ── */
        .card-socials {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .card-socials a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color .2s;
        }

        .card-socials a:hover {
            color: var(--color-dark);
        }
    </style>
</head>
<body>

<div class="card-wrap">
    <div class="card">

        <!-- HEADER: avatar + name -->
        <div class="card-header">
            <div class="avatar-wrap">
                <img src="images/azalea/avatar.png" alt="avatar">
            </div>
            <div class="card-titles">
                <h1>Tama</h1>
                <h4 id="meta-line"></h4>
            </div>
        </div>

        <hr class="card-divider">

        <!-- CHARACTERS SECTION -->
        <p class="characters-desc">
            Hi, Suprised you found this. <br>
            I enjoy art and like to commission and collect from various places.<br>
            Here are some of my characters below.
        </p>
        <p class="characters-title">Characters</p>
        <div class="characters-buttons">
            <a href="https://toyhou.se/24493539.azalea" class="btn-characters">Azalea</a>
        </div>

        <hr class="card-divider">

        <!-- SOCIAL ICONS -->
        <div class="card-socials">

            <a href="https://www.twitch.tv/afriendlypug" target="_blank" title="Twitch">
                <i class="fab fa-x-twitter fa-fw fa-2x">Twitch</i>
            </a>

            <a href="https://toyhou.se/TamaCat" target="_blank" title="Toyhou.se">
                <i class="fab fa-deviantart fa-fw fa-2x">Toyhou.se</i>
            </a>

        </div>

    </div>
</div>

<script>
    (function () {
        var BIRTHDAY = new Date(2001, 2, 6); // 6 March 2001 (month is 0-indexed)

        function isBST(date) {
            // BST runs from the last Sunday of March at 01:00 UTC
            // to the last Sunday of October at 01:00 UTC
            var lastSundayOfMonth = function (year, month) {
                var d = new Date(Date.UTC(year, month + 1, 0)); // last day of month
                d.setUTCDate(d.getUTCDate() - d.getUTCDay()); // rewind to Sunday
                return d;
            };

            var year = date.getUTCFullYear();
            var bstStart = lastSundayOfMonth(year, 2); // last Sun of March
            bstStart.setUTCHours(1, 0, 0, 0);
            var bstEnd = lastSundayOfMonth(year, 9);   // last Sun of October
            bstEnd.setUTCHours(1, 0, 0, 0);

            return date >= bstStart && date < bstEnd;
        }

        function getAge(now) {
            var age = now.getFullYear() - BIRTHDAY.getFullYear();
            var m = now.getMonth() - BIRTHDAY.getMonth();
            if (m < 0 || (m === 0 && now.getDate() < BIRTHDAY.getDate())) age--;
            return age;
        }

        var now = new Date();
        var age = getAge(now);
        var tz  = isBST(now) ? 'BST' : 'GMT';

        document.getElementById('meta-line').textContent = age + ' | ' + tz;
    })();
</script>
</body>
</html>
